<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>NEXAUTO — Workshop operations</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.4/chart.umd.min.js"></script>
<style>
:root{
  --canvas:#F3F5F2; --surface:#FFFFFF; --surface-2:#F7F8F6;
  --border:#E2E5E0; --border-strong:#CDD2C9;
  --text-primary:#181B18; --text-secondary:#5F665B; --text-muted:#949A8F;
  --green:#0E7C3A;
  --green-dark:color-mix(in srgb, var(--green) 72%, #000);
  --green-light:color-mix(in srgb, var(--green) 12%, var(--surface));
  --green-bright:color-mix(in srgb, var(--green) 55%, #fff);
  --on-green:#FFFFFF;
  --amber:#9A5F10; --amber-light:#FBF0DE;
  --red:#A8321F; --red-light:#FBE7E2;
  --sidebar-bg:#13201A; --sidebar-bg-2:#1E3127; --sidebar-text:#B9C4BB;
  --radius:10px;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --canvas:#0F1210; --surface:#171B18; --surface-2:#1E221F;
    --border:#2B302B; --border-strong:#3B403A;
    --text-primary:#ECEFEA; --text-secondary:#A7ADA2; --text-muted:#787E72;
    --green-dark:color-mix(in srgb, var(--green) 50%, #fff);
    --green-light:color-mix(in srgb, var(--green) 24%, var(--surface));
    --amber:#E8AE5C; --amber-light:#382A14;
    --red:#EE7A6B; --red-light:#3A1916;
    --sidebar-bg:#0B120E; --sidebar-bg-2:#18261E;
  }
}
:root[data-theme="dark"]{
  --canvas:#0F1210; --surface:#171B18; --surface-2:#1E221F;
  --border:#2B302B; --border-strong:#3B403A;
  --text-primary:#ECEFEA; --text-secondary:#A7ADA2; --text-muted:#787E72;
  --green-dark:color-mix(in srgb, var(--green) 50%, #fff);
  --green-light:color-mix(in srgb, var(--green) 24%, var(--surface));
  --amber:#E8AE5C; --amber-light:#382A14;
  --red:#EE7A6B; --red-light:#3A1916;
  --sidebar-bg:#0B120E; --sidebar-bg-2:#18261E;
}
html{scroll-padding-top:env(safe-area-inset-top,0px);}
*,*::before,*::after{box-sizing:border-box;}
html,body{height:100%;margin:0;}
body{font-family:'Inter',system-ui,-apple-system,Segoe UI,sans-serif;background:var(--canvas);color:var(--text-primary);-webkit-font-smoothing:antialiased;font-size:14px;line-height:1.5;}
h1,h2,h3,.brand,.num{font-family:'Space Grotesk','Inter',system-ui,sans-serif;}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit;}
button{cursor:pointer;}
:focus-visible{outline:2px solid var(--green);outline-offset:2px;}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;}
img,svg{max-width:100%;}

/* shell */
.app{display:flex;min-height:100%;}
.sidebar{width:232px;flex:0 0 232px;background:var(--sidebar-bg);color:var(--sidebar-text);display:flex;flex-direction:column;padding:20px 14px;position:sticky;top:0;height:100vh;height:100dvh;}
.brand{display:flex;align-items:center;gap:10px;color:#fff;font-weight:700;font-size:19px;letter-spacing:.3px;padding:4px 8px 22px;}
.brand-mark{width:30px;height:30px;border-radius:8px;background:var(--green);display:flex;align-items:center;justify-content:center;flex:0 0 30px;}
.brand-mark svg{width:17px;height:17px;}
.nav{display:flex;flex-direction:column;gap:2px;}
.nav-item{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:8px;color:var(--sidebar-text);font-weight:500;border:none;background:none;width:100%;text-align:left;}
.nav-item svg{width:18px;height:18px;flex:0 0 18px;}
.nav-item:hover{background:var(--sidebar-bg-2);}
.nav-item.active{background:var(--green);color:#fff;}
.sidebar-foot{margin-top:auto;border-top:1px solid rgba(255,255,255,.08);padding-top:14px;display:flex;align-items:center;gap:10px;}
.avatar{width:32px;height:32px;border-radius:50%;background:var(--green);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:600;font-size:12px;flex:0 0 32px;}
.who{font-size:13px;color:#fff;font-weight:500;line-height:1.3;}
.who span{display:block;font-size:12px;color:var(--sidebar-text);font-weight:400;}

.main{flex:1;min-width:0;display:flex;flex-direction:column;}
.topbar{position:sticky;top:0;z-index:10;background:var(--surface);border-bottom:1px solid var(--border);padding:12px 20px;display:flex;align-items:center;justify-content:space-between;gap:12px;}
.topbar h1{font-size:19px;font-weight:600;margin:0;line-height:1.2;}
.topbar .sub{font-size:12.5px;color:var(--text-secondary);margin:2px 0 0;}
.content{padding:18px 16px calc(96px + env(safe-area-inset-bottom,0px));flex:1;width:100%;max-width:1280px;}
@media (min-width:768px){.content{padding:24px 28px 32px;}}
.view{display:none;}
.view.active{display:block;}

select,input[type=text],input[type=number],input[type=tel],input[type=search],textarea{border:1px solid var(--border-strong);background:var(--surface);border-radius:8px;padding:9px 11px;width:100%;}
select{padding:8px 10px;}
.role-select{width:auto;font-weight:500;font-size:13px;}

/* bottom nav */
.bottom-nav{display:flex;position:fixed;left:0;right:0;bottom:0;background:var(--sidebar-bg);padding:6px 2px calc(6px + env(safe-area-inset-bottom,0px));z-index:20;}
.bottom-nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;background:none;border:none;color:var(--sidebar-text);font-size:10.5px;padding:5px 0;font-weight:500;min-width:0;}
.bottom-nav svg{width:20px;height:20px;}
.bottom-nav button.active{color:#fff;}
.bottom-nav button.active svg{color:var(--green-bright);}
@media (min-width:768px){.bottom-nav{display:none;}}
@media (max-width:767px){.sidebar{display:none;}}

/* building blocks */
.section-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px;flex-wrap:wrap;}
.section-head h2{font-size:15px;margin:0;font-weight:600;}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px;}
.card + .card{margin-top:16px;}
.card h2{font-size:15px;font-weight:600;margin:0;}
.grid-2{display:grid;grid-template-columns:minmax(0,1fr);gap:16px;margin-bottom:16px;}
@media (min-width:900px){.grid-2{grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);}}
.grid-2 > .card + .card{margin-top:0;}

.kpi-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-bottom:16px;}
@media (min-width:700px){.kpi-grid{grid-template-columns:repeat(4,minmax(0,1fr));}}
.kpi{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:14px 16px;}
.kpi .label{font-size:12.5px;color:var(--text-secondary);margin:0 0 6px;}
.kpi .value{font-size:24px;font-weight:700;margin:0;line-height:1.1;}
.kpi .foot{font-size:12px;color:var(--green-dark);margin-top:6px;}
.kpi.hero{background:var(--green);border-color:var(--green);color:#fff;}
.kpi.hero .label,.kpi.hero .foot{color:rgba(255,255,255,.82);}

.quick-actions{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-bottom:16px;}
@media (min-width:700px){.quick-actions{grid-template-columns:repeat(4,minmax(0,1fr));}}
.qa-btn{display:flex;align-items:center;gap:10px;padding:12px;border:1px solid var(--border);border-radius:var(--radius);background:var(--surface);font-weight:600;font-size:13px;text-align:left;}
.qa-btn:hover{border-color:var(--border-strong);}
.qa-btn .ico{width:32px;height:32px;border-radius:8px;background:var(--green-light);color:var(--green-dark);display:flex;align-items:center;justify-content:center;flex:0 0 32px;}
.qa-btn .ico svg{width:17px;height:17px;}
.qa-btn.primary{background:var(--green);border-color:var(--green);color:#fff;}
.qa-btn.primary .ico{background:rgba(255,255,255,.18);color:#fff;}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:9px 14px;border-radius:8px;font-weight:600;font-size:13.5px;border:1px solid var(--border-strong);background:var(--surface);white-space:nowrap;}
.btn:hover{background:var(--surface-2);}
.btn svg{width:15px;height:15px;}
.btn.primary{background:var(--green);border-color:var(--green);color:#fff;}
.btn.primary:hover{background:var(--green-dark);}
.btn.danger{color:var(--red);}
.btn.sm{padding:6px 10px;font-size:12.5px;}
.btn.ghost{border-color:transparent;background:transparent;}
.link-btn{background:none;border:none;color:var(--green-dark);font-weight:600;font-size:12.5px;padding:2px 4px;}

.chips{display:flex;gap:8px;overflow-x:auto;margin-bottom:12px;padding-bottom:2px;scrollbar-width:none;}
.chip{flex:0 0 auto;padding:7px 13px;border-radius:999px;border:1px solid var(--border-strong);background:var(--surface);font-size:12.5px;font-weight:500;white-space:nowrap;color:var(--text-secondary);}
.chip .n{margin-left:6px;opacity:.75;}
.chip.active{background:var(--green);border-color:var(--green);color:#fff;}
.toolbar{display:flex;gap:10px;margin-bottom:12px;align-items:center;}
.toolbar input{flex:1;}

.list{display:flex;flex-direction:column;gap:8px;}
.row-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:12px 14px;display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;text-align:left;}
button.row-card:hover{border-color:var(--border-strong);}
.row-main{min-width:0;}
.row-main .title{font-weight:600;font-size:14px;margin:0 0 2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.row-main .sub{font-size:12.5px;color:var(--text-secondary);margin:0;}
.row-end{text-align:right;flex:0 0 auto;display:flex;flex-direction:column;align-items:flex-end;gap:4px;}
.amt{font-weight:600;font-family:'Space Grotesk',sans-serif;font-size:14px;}
.plate{display:inline-block;font-family:'Space Grotesk',sans-serif;font-weight:700;letter-spacing:.4px;background:var(--surface-2);border:1px solid var(--border-strong);border-radius:5px;padding:0 6px;font-size:12.5px;margin-right:6px;}

.badge{display:inline-block;font-size:11px;font-weight:600;padding:3px 9px;border-radius:999px;white-space:nowrap;}
.b-neutral{background:var(--surface-2);color:var(--text-secondary);border:1px solid var(--border);}
.b-amber{background:var(--amber-light);color:var(--amber);}
.b-green{background:var(--green-light);color:var(--green-dark);}
.b-red{background:var(--red-light);color:var(--red);}
.b-muted{background:var(--surface-2);color:var(--text-muted);}

.pipe-row{display:flex;align-items:center;justify-content:space-between;padding:11px 4px;border-bottom:1px solid var(--border);background:none;border-left:none;border-right:none;border-top:none;width:100%;text-align:left;}
.pipe-row:last-child{border-bottom:none;}
.pipe-row .count{font-weight:700;font-family:'Space Grotesk',sans-serif;font-size:15px;}
.bar{height:6px;border-radius:3px;background:var(--surface-2);margin-top:6px;overflow:hidden;}
.bar > i{display:block;height:100%;background:var(--green);border-radius:3px;}

.opp{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;padding:10px 12px;border-radius:8px;background:var(--amber-light);margin-bottom:8px;}
.opp .t{font-size:13px;color:var(--amber);font-weight:500;}
.opp .t b{display:block;color:var(--text-primary);font-weight:600;}
.opp .acts{display:flex;gap:4px;flex:0 0 auto;}
.empty{padding:18px;text-align:center;color:var(--text-secondary);font-size:13px;border:1px dashed var(--border-strong);border-radius:var(--radius);}

table{width:100%;border-collapse:collapse;font-size:13.5px;}
th{text-align:left;font-weight:600;color:var(--text-secondary);font-size:12px;padding:10px 12px;border-bottom:1px solid var(--border);white-space:nowrap;}
td{padding:10px 12px;border-bottom:1px solid var(--border);vertical-align:middle;}
tr:last-child td{border-bottom:none;}
.table-wrap{overflow-x:auto;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);}
.table-wrap table{min-width:640px;}

/* role gating */
html[data-can-cost="0"] [data-cost],
html[data-can-price="0"] [data-price],
html[data-can-revenue="0"] [data-revenue],
html[data-can-purchase="0"] [data-purchase],
html[data-can-staff="0"] [data-staff],
html[data-can-edit="0"] [data-edit],
html[data-can-revenue="1"] [data-personal]{display:none !important;}

/* panels */
.backdrop{position:fixed;inset:0;background:rgba(8,12,9,.5);opacity:0;visibility:hidden;transition:opacity .18s ease,visibility .18s;z-index:30;}
.backdrop.open{opacity:1;visibility:visible;}
.panel{position:fixed;top:0;right:0;bottom:0;width:100%;max-width:460px;background:var(--surface);transform:translateX(102%);transition:transform .24s ease;z-index:31;display:flex;flex-direction:column;padding-bottom:env(safe-area-inset-bottom,0px);}
.panel.open{transform:none;}
@media (max-width:767px){
  .panel{top:auto;height:92%;max-width:100%;border-radius:16px 16px 0 0;transform:translateY(102%);}
}
.panel-head{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;padding:16px 18px 12px;border-bottom:1px solid var(--border);}
.panel-head h3{margin:0;font-size:17px;}
.panel-head .sub{font-size:12.5px;color:var(--text-secondary);margin:3px 0 0;}
.panel-body{padding:16px 18px;overflow-y:auto;flex:1;}
.panel-foot{padding:12px 18px;border-top:1px solid var(--border);display:flex;gap:10px;}
.panel-foot .btn{flex:1;padding:11px 14px;}
.panel-foot:empty{display:none;}
.icon-btn{background:none;border:none;color:var(--text-secondary);padding:4px;border-radius:6px;display:inline-flex;}
.icon-btn:hover{background:var(--surface-2);}
.icon-btn svg{width:20px;height:20px;}
.tabs{display:flex;gap:4px;padding:0 14px;border-bottom:1px solid var(--border);}
.tab{background:none;border:none;padding:11px 8px;font-weight:600;font-size:13px;color:var(--text-secondary);border-bottom:2px solid transparent;margin-bottom:-1px;}
.tab.active{color:var(--green-dark);border-bottom-color:var(--green);}
.tab .n{font-weight:500;color:var(--text-muted);margin-left:4px;}

.stepper{display:flex;gap:4px;margin-bottom:16px;}
.step{flex:1;text-align:center;}
.step i{display:block;height:5px;border-radius:3px;background:var(--border);margin-bottom:6px;}
.step span{font-size:10.5px;font-weight:600;color:var(--text-muted);}
.step.done i{background:var(--green);}
.step.now i{background:var(--green);}
.step.now span{color:var(--green-dark);}
.step.done span{color:var(--text-secondary);}

.kv{display:grid;grid-template-columns:110px minmax(0,1fr);gap:8px 12px;font-size:13.5px;margin-bottom:16px;}
.kv dt{color:var(--text-secondary);}
.kv dd{margin:0;font-weight:500;}
.kv select{padding:5px 8px;}
.h4{font-size:13px;font-weight:700;margin:18px 0 8px;display:flex;align-items:center;justify-content:space-between;}
.log{border-left:2px solid var(--border);padding-left:12px;margin-left:4px;}
.log p{margin:0 0 10px;font-size:12.5px;color:var(--text-secondary);}
.log p b{color:var(--text-primary);font-weight:500;}

.insp-sum{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;margin-bottom:14px;}
.insp-sum div{background:var(--surface-2);border-radius:8px;padding:8px;text-align:center;font-size:11px;color:var(--text-secondary);}
.insp-sum b{display:block;font-size:17px;font-family:'Space Grotesk',sans-serif;color:var(--text-primary);}
.insp-item{padding:10px 0;border-bottom:1px solid var(--border);}
.insp-item:last-child{border-bottom:none;}
.insp-top{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;}
.insp-top .nm{font-size:13.5px;font-weight:500;}
.seg{display:inline-flex;border:1px solid var(--border-strong);border-radius:8px;overflow:hidden;}
.seg button{border:none;background:var(--surface);padding:5px 10px;font-size:12px;font-weight:600;color:var(--text-secondary);}
.seg button + button{border-left:1px solid var(--border-strong);}
.seg button.on-good{background:var(--green-light);color:var(--green-dark);}
.seg button.on-attention{background:var(--amber-light);color:var(--amber);}
.seg button.on-problem{background:var(--red-light);color:var(--red);}
.seg button:disabled{cursor:default;}
.insp-note{margin-top:6px;font-size:12.5px;padding:6px 9px;}

.line{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px solid var(--border);font-size:13.5px;}
.line .l{min-width:0;}
.line .l small{display:block;color:var(--text-muted);font-size:11.5px;}
.line .r{display:flex;align-items:center;gap:6px;flex:0 0 auto;}
.totals{margin-top:10px;font-size:13.5px;}
.totals div{display:flex;justify-content:space-between;align-items:center;padding:4px 0;}
.totals .grand{font-weight:700;font-size:16px;border-top:1px solid var(--border-strong);margin-top:6px;padding-top:10px;}
.totals input{width:90px;padding:4px 8px;text-align:right;}
.hint{background:var(--surface-2);border-radius:8px;padding:10px 12px;font-size:12.5px;color:var(--text-secondary);margin-bottom:12px;}
.hint.warn{background:var(--amber-light);color:var(--amber);}
.finding{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:6px 0;font-size:12.5px;}

/* modal */
.modal-wrap{position:fixed;inset:0;z-index:40;display:flex;align-items:center;justify-content:center;padding:16px;visibility:hidden;opacity:0;transition:opacity .15s ease,visibility .15s;background:rgba(8,12,9,.5);}
.modal-wrap.open{visibility:visible;opacity:1;}
.modal{background:var(--surface);border-radius:14px;width:100%;max-width:440px;max-height:calc(100dvh - 32px);display:flex;flex-direction:column;}
.modal-head{padding:16px 18px 6px;display:flex;justify-content:space-between;align-items:center;}
.modal-head h3{margin:0;font-size:16px;}
.modal form{display:flex;flex-direction:column;min-height:0;flex:1;}
.modal-body{padding:8px 18px;overflow-y:auto;}
.modal-foot{padding:12px 18px 16px;display:flex;gap:10px;}
.modal-foot .btn{flex:1;padding:11px;}
.field{margin-bottom:12px;}
.field label{display:block;font-size:12.5px;color:var(--text-secondary);margin-bottom:5px;font-weight:500;}
.field-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.form-error{color:var(--red);font-size:12.5px;margin:4px 0 0;min-height:1em;}
.po-line{display:grid;grid-template-columns:minmax(0,1fr) 70px 34px;gap:8px;margin-bottom:8px;align-items:center;}
.group-box{border:1px solid var(--border);border-radius:10px;padding:12px 12px 2px;margin-bottom:12px;background:var(--surface-2);}

.swatches{display:flex;gap:10px;flex-wrap:wrap;align-items:center;}
.swatch{width:36px;height:36px;border-radius:50%;border:3px solid var(--surface);box-shadow:0 0 0 1px var(--border-strong);}
.swatch.active{box-shadow:0 0 0 2px var(--text-primary);}
input[type=color]{width:40px;height:36px;padding:2px;border:1px solid var(--border-strong);border-radius:8px;background:var(--surface);}

.chart-box{position:relative;height:230px;}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:var(--text-primary);color:var(--surface);padding:10px 16px;border-radius:10px;font-size:13px;font-weight:500;opacity:0;visibility:hidden;transition:all .2s ease;z-index:50;max-width:calc(100% - 32px);text-align:center;}
.toast.show{opacity:1;visibility:visible;transform:translate(-50%,0);}
.toast.err{background:var(--red);color:#fff;}
@media (min-width:768px){.toast{bottom:28px;}}
@media (prefers-reduced-motion:reduce){*{transition:none !important;}}
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar" aria-label="Main navigation">
    <div class="brand">
      <span class="brand-mark"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 17V9l2-4h9l3 5h2v7"/><path d="M4 17h1.6M8.8 17h6.4M18.4 17H20"/><circle cx="7.2" cy="17" r="1.6"/><circle cx="16.8" cy="17" r="1.6"/></svg></span>
      NEXAUTO
    </div>
    <nav class="nav" id="sideNav"></nav>
    <div class="sidebar-foot">
      <div class="avatar" id="sideAvatar">AT</div>
      <div class="who"><span id="sideName" style="display:inline;color:#fff;font-size:13px;font-weight:500">Alex Tan</span><span id="sideRole">Owner</span></div>
    </div>
  </aside>

  <div class="main">
    <header class="topbar">
      <div>
        <h1 id="pageTitle">Dashboard</h1>

function totals(o){
  var sub = 0, cost = 0;
  o.items.forEach(function(i){ sub += i.qty * i.price; cost += i.qty * i.cost; });
  var total = Math.max(0, sub - (o.discount||0));
  return {sub:sub, total:total, cost:cost, profit:total - cost, margin: total ? Math.round((total - cost) / total * 100) : 0};
}

  var c = {good:0, attention:0, problem:0, unchecked:0};

function avail(p){ return p.stock - (p.reserved || 0); }
function lowStock(){ return DB.inventory.filter(function(p){ return avail(p) <= p.reorder; }); }

function reserve(o, onlyNew){

  o.items.forEach(function(i){ if(i.type === "part" && (!onlyNew || !i.approved)) need[i.sku] = (need[i.sku]||0) + i.qty; });
  var short = Object.keys(need).filter(function(k){ var pp = part(k); return !pp || avail(pp) < need[k]; });

  Object.keys(need).forEach(function(k){ part(k).reserved = (part(k).reserved||0) + need[k]; });
  o.items.forEach(function(i){ i.approved = true; });
  return null;
}

    '<div class="kpi" data-revenue><p class="label">Gross profit</p><p class="value num">' + money(profit) + '</p><p class="foot">Margin ' + (revenue ? Math.round(profit/revenue*100) : 0) + '%</p></div>' +
    '<div class="kpi hero" data-personal><p class="label">My open jobs</p><p class="value num">' + mineOpen + '</p><p class="foot">Assigned to you</p></div>' +
    '<div class="kpi" data-personal><p class="label">My completed today</p><p class="value num">' + mineDone + '</p></div>' +

    '<div class="kpi"><p class="label">Open opportunities</p><p class="value num">' + opps.length + '</p></div>' +
  '</div>';

  var maxC = 1;

/* ================= order panel ================= */
function allowedOrder(o){ return o && (can("all") || o.technicianId === me().id); }
function allowedCustomer(c){ return c && (can("all") || DB.orders.some(function(o){ return o.customerId === c.id && o.technicianId === me().id; })); }
function openPanel(p){
  if(p.type === "order" && !allowedOrder(order(p.id))){ toast("This job isn't assigned to you", true); return; }
  if(p.type === "customer" && !allowedCustomer(cust(p.id))){ toast("You can only view customers on your jobs", true); return; } state.panel = p; if(p.type === "order" && !p.keepTab) state.orderTab = "overview"; renderPanel(); $("#panel").classList.add("open"); $("#backdrop").classList.add("open"); }
function closePanel(){ state.panel = null; $("#panel").classList.remove("open"); $("#backdrop").classList.remove("open"); }
function renderPanel(){
  if(!state.panel) return;
  if(state.panel.type === "order") renderOrderPanel(order(state.panel.id));
  else renderCustomerPanel(cust(state.panel.id));
}
function renderOrderPanel(o){

    '<select data-action="reassign" data-id="' + o.id + '">' + technicians().map(function(t){ return '<option value="' + t.id + '"' + (t.id === o.technicianId ? ' selected' : '') + '>' + esc(t.name) + '</option>'; }).join("") + '</select>' :
    esc(staffName(o.technicianId));
  var html = stepper + '<dl class="kv">' +
    '<dt>Customer</dt><dd><button class="link-btn" style="padding:0;font-size:13.5px" data-action="open-customer" data-id="' + c.id + '">' + esc(c.name) + '</button> <span class="badge b-amber">' + esc(c.tier) + '</span></dd>' +
    '<dt>Phone</dt><dd>' + esc(c.phone) + '</dd>' +
    '<dt>Vehicle</dt><dd>' + esc(v.model) + '</dd>' +

  '</dl>';
  html += '<div class="h4">Activity</div><div class="log">' + o.log.slice().reverse().map(function(l){ return '<p><b>' + esc(l.x) + '</b><br>' + new Date(l.t).toLocaleString([], {day:"numeric", month:"short", hour:"2-digit", minute:"2-digit"}) + '</p>'; }).join("") + '</div>';

function orderInspection(o, ic){
  var editable = o.stage === "pre-inspection";
  var html = '<div class="insp-sum"><div><b>' + ic.good + '</b>Good</div><div><b>' + ic.attention + '</b>Attention</div><div><b>' + ic.problem + '</b>Problem</div><div><b>' + ic.unchecked + '</b>Unchecked</div></div>';
  if(o.stage === "reception") html += '<div class="hint">Start the inspection to fill in this checklist.</div>';
  else if(!editable) html += '<div class="hint">Inspection is locked because the order has moved past this stage.</div>';
  html += o.inspection.map(function(it, i){
    var seg = ["good","attention","problem"].map(function(s){
      return '<button type="button" class="' + (it.status === s ? 'on-' + s : '') + '" data-action="insp-set" data-i="' + i + '" data-s="' + s + '"' + (editable ? '' : ' disabled') + '>' + (s === "good" ? "Good" : s === "attention" ? "Attention" : "Problem") + '</button>';
    }).join("");
    var note = editable ? '<input type="text" class="insp-note" data-action="insp-note" data-i="' + i + '" placeholder="Add a note for this item" value="' + esc(it.note) + '">' : (it.note ? '<p class="sub" style="margin:4px 0 0;font-size:12.5px;color:var(--text-secondary)">' + esc(it.note) + '</p>' : '');
    return '<div class="insp-item"><div class="insp-top"><span class="nm">' + esc(it.name) + '</span><div class="seg">' + seg + '</div></div>' + note + '</div>';
  }).join("");
  return html;
}
function orderItems(o){
  var editable = can("edit") && (o.stage === "quotation" || o.stage === "in-service");
  var t = totals(o), html = "";
  var qs = {draft:"Draft, not sent yet", sent:"Sent, waiting for customer", approved:"Approved by customer", rejected:"Declined by customer"};
  if(o.stage === "reception" || o.stage === "pre-inspection") html += '<div class="hint">Finish the inspection first. The quote opens once the checklist is complete.</div>';
  else html += '<div class="hint">Quote status: <b style="color:var(--text-primary)">' + qs[o.quoteStatus] + '</b>' + (o.stage === "in-service" && editable ? '. Anything added now is extra work and needs the customer\'s approval.' : '') + '</div>';

  var findings = o.inspection.filter(function(i){ return i.status === "problem" || i.status === "attention"; });
  if(findings.length && o.stage !== "reception"){
    html += '<div class="h4" style="margin-top:4px">Inspection findings</div>' + findings.map(function(f){
      var added = o.items.some(function(it){ return it.name.indexOf(f.name) > -1; });
      return '<div class="finding"><span><span class="badge ' + (f.status === "problem" ? "b-red" : "b-amber") + '">' + (f.status === "problem" ? "Problem" : "Attention") + '</span> ' + esc(f.name) + (f.note ? ' — ' + esc(f.note) : '') + '</span>' +
        (editable && !added ? '<button class="btn sm" data-action="add-labor" data-prefill="' + esc("Repair: " + f.name) + '">Add to quote</button>' : (added ? '<span class="badge b-green">Quoted</span>' : '')) + '</div>';
    }).join("");
  }

  html += '<div class="h4">Line items' + (editable ? '<span style="display:flex;gap:6px"><button class="btn sm" data-action="add-part">' + icon("plus") + 'Part</button><button class="btn sm" data-action="add-labor">' + icon("plus") + 'Labor</button></span>' : '') + '</div>';
  if(!o.items.length) html += '<div class="empty">No items yet.' + (editable ? ' Add parts from stock or labor charges.' : '') + '</div>';
  html += o.items.map(function(it){
    var pend = o.stage === "in-service" && !it.approved;
    return '<div class="line"><div class="l">' + esc(it.name) + (pend ? ' <span class="badge b-amber">Needs approval</span>' : '') + '<small>' + (it.type === "part" ? "Part · " + esc(it.sku) : "Labor") + ' · Qty ' + it.qty + '<span data-cost> · cost ' + money(it.cost * it.qty) + '</span></small></div>' +
      '<div class="r"><span data-price>' + money(it.price * it.qty) + '</span>' + (editable ? '<button class="icon-btn" data-action="remove-item" data-item="' + it.id + '" aria-label="Remove item">' + icon("trash") + '</button>' : '') + '</div></div>';
  }).join("");
  if(o.items.length){
    html += '<div class="totals" data-price><div><span>Subtotal</span><span>' + money(t.sub) + '</span></div>' +
      '<div><span>Discount</span>' + (editable && o.stage === "quotation" ? '<input type="number" min="0" step="1" data-action="discount" value="' + (o.discount||0) + '">' : '<span>' + money(o.discount) + '</span>') + '</div>' +
      '<div class="grand"><span>Total</span><span>' + money(t.total) + '</span></div>' +
      '<div data-cost style="color:var(--text-secondary);font-size:12.5px"><span>Cost ' + money(t.cost) + '</span><span>Profit ' + money(t.profit) + ' · ' + t.margin + '%</span></div></div>';
  }
  return html;
}
function orderActions(o, ic){
  var b = [];
  if(o.stage === "reception") b.push('<button class="btn primary" data-action="start-insp">Start inspection</button>');
  if(o.stage === "pre-inspection") b.push('<button class="btn primary" data-action="finish-insp">' + (ic.unchecked ? 'Finish inspection (' + ic.unchecked + ' left)' : 'Finish inspection') + '</button>');
  if(o.stage === "quotation"){
    if(!can("edit")) b.push('<button class="btn" disabled style="opacity:.7">Waiting for customer approval</button>');
    else if(o.quoteStatus === "draft") b.push('<button class="btn primary" data-action="send-quote">Send quote to customer</button>');
    else { b.push('<button class="btn danger" data-action="decline-quote">Declined</button>'); b.push('<button class="btn primary" data-action="approve-quote">Approved</button>'); }
  }
  if(o.stage === "in-service"){
    var pendN = o.items.filter(function(i){ return !i.approved; }).length;
    if(pendN && can("edit")) b.push('<button class="btn" data-action="approve-extra">Approve extra work (' + pendN + ')</button>');
    if(!o.workDone) b.push('<button class="btn primary" data-action="work-done">Mark work done</button>');
    else if(pendN) b.push('<button class="btn" disabled style="opacity:.7">Extra work waiting for approval</button>');
    else if(can("pay")) b.push('<button class="btn primary" data-action="take-payment">Take payment and close</button>');
    else b.push('<button class="btn" disabled style="opacity:.7">Done, waiting for payment</button>');
  }
  return b.join("");
}

/* order actions */
function currentOrder(){ return state.panel && state.panel.type === "order" ? order(state.panel.id) : null; }
function doStartInsp(o){ o.stage = "pre-inspection"; log(o, "Inspection started by " + me().name); state.orderTab = "inspection"; toast("Inspection started"); refresh(); }
function doFinishInsp(o){
  var ic = inspCounts(o);
  if(ic.unchecked){ toast("Check all " + ic.unchecked + " remaining items first", true); state.orderTab = "inspection"; renderPanel(); return; }
  o.stage = "quotation"; o.quoteStatus = "draft";
  log(o, "Inspection completed by " + me().name + " (" + ic.problem + " problem, " + ic.attention + " attention)");
  state.orderTab = "items"; toast("Inspection complete. Build the quote next."); refresh();
}
function doSendQuote(o){
  if(!o.items.length){ toast("Add at least one item before sending", true); return; }
  o.quoteStatus = "sent"; log(o, "Quotation sent to customer (" + money(totals(o).total) + ")"); toast("Quote sent"); refresh();
}
function doApprove(o){
  var err = reserve(o, false);
  if(err){ toast(err, true); return; }
  o.stage = "in-service"; o.quoteStatus = "approved"; log(o, "Customer approved quotation, parts reserved"); toast("Approved. Parts reserved, job is in service."); refresh();
}
function doApproveExtra(o){
  var err = reserve(o, true);
  if(err){ toast(err, true); return; }
  log(o, "Customer approved additional work (" + money(totals(o).total) + " total)"); toast("Additional work approved"); refresh();
}
function doDecline(o){
  o.stage = "declined"; o.quoteStatus = "rejected"; log(o, "Customer declined quotation");
  DB.opportunities.push({id:uid("o"), customerId:o.customerId, type:"declined-quote", text:"Declined quote " + money(totals(o).total) + " on " + o.id, dueAt:new Date(Date.now()+14*86400000).toISOString(), sourceOrderId:o.id, status:"open", createdAt:nowISO()});
  toast("Marked declined. Follow-up added."); state.orderTab = "overview"; refresh();
}
function doWorkDone(o){ o.workDone = true; log(o, "Work marked done by " + me().name); toast("Work marked done"); refresh(); }

/* ================= reports ================= */
var charts = {};
function killCharts(){ Object.keys(charts).forEach(function(k){ charts[k].destroy(); }); charts = {}; }
function renderReports(){
  killCharts();
  var green = getComputedStyle(document.documentElement).getPropertyValue("--green").trim() || "#0E7C3A";
  var textColor = getComputedStyle(document.documentElement).getPropertyValue("--text-secondary").trim();
  var gridColor = getComputedStyle(document.documentElement).getPropertyValue("--border").trim();
  var paid = paidToday();
  var todayRev = paid.reduce(function(s,o){ return s + totals(o).total; }, 0);
  var week = DB.history.concat([todayRev]);
  var weekTotal = week.reduce(function(a,b){ return a+b; }, 0);
  var completed = DB.orders.filter(function(o){ return o.stage === "completed"; });
  var partsRev = 0, laborRev = 0;
  completed.forEach(function(o){ o.items.forEach(function(i){ if(i.type === "part") partsRev += i.qty*i.price; else laborRev += i.qty*i.price; }); });
  var avg = completed.length ? Math.round(completed.reduce(function(s,o){ return s + totals(o).total; }, 0) / completed.length) : 0;
  var days = []; for(var d = 6; d >= 0; d--){ days.push(new Date(Date.now() - d*86400000).toLocaleDateString(undefined, {weekday:"short"})); }
  var techs = technicians();
  var techJobs = techs.map(function(t){ return completed.filter(function(o){ return o.technicianId === t.id; }).length + 8 + (t.id.charCodeAt(1) % 5); });
  var conv = DB.orders.filter(function(o){ return o.quoteStatus === "approved"; }).length, decl = DB.orders.filter(function(o){ return o.quoteStatus === "rejected"; }).length;
  var convRate = (conv + decl) ? Math.round(conv/(conv+decl)*100) : 100;

  var u = me();
  var myDone = DB.orders.filter(function(o){ return o.technicianId === u.id && o.stage === "completed"; }).length;
  var html = '<div data-revenue><div class="kpi-grid">' +
    '<div class="kpi hero"><p class="label">Revenue, 7 days</p><p class="value num">' + money(weekTotal) + '</p></div>' +
    '<div class="kpi"><p class="label">Average ticket</p><p class="value num">' + money(avg) + '</p></div>' +
    '<div class="kpi"><p class="label">Quote approval</p><p class="value num">' + convRate + '%</p></div>' +
    '<div class="kpi"><p class="label">Parts vs labor</p><p class="value num">' + ((partsRev+laborRev) ? Math.round(partsRev/(partsRev+laborRev)*100) : 0) + '% / ' + ((partsRev+laborRev) ? Math.round(laborRev/(partsRev+laborRev)*100) : 0) + '%</p></div></div>' +
    '<div class="grid-2"><div class="card"><div class="section-head"><h2>Daily revenue</h2></div><div class="chart-box"><canvas id="chRev"></canvas></div></div>' +
    '<div class="card"><div class="section-head"><h2>Jobs by technician, this month</h2></div><div class="chart-box"><canvas id="chTech"></canvas></div></div></div></div>' +
    '<div data-personal><div class="kpi-grid"><div class="kpi hero"><p class="label">Jobs completed</p><p class="value num">' + (myDone + 11) + '</p><p class="foot">This month</p></div><div class="kpi"><p class="label">Open now</p><p class="value num">' + DB.orders.filter(function(o){ return (o.technicianId === u.id || o.advisorId === u.id) && ["completed","declined"].indexOf(o.stage) < 0; }).length + '</p></div></div>' +
    '<div class="card"><div class="section-head"><h2>My jobs, last 7 days</h2></div><div class="chart-box"><canvas id="chMine"></canvas></div></div></div>';
  $("#v-reports").innerHTML = html;
  if(typeof Chart === "undefined") return;
  try{
    Chart.defaults.color = textColor; Chart.defaults.font.family = "Inter, system-ui, sans-serif";
    var opts = {responsive:true, maintainAspectRatio:false, plugins:{legend:{display:false}}, scales:{x:{grid:{display:false}}, y:{beginAtZero:true, grid:{color:gridColor}}}};
    if(can("revenue")){
      charts.rev = new Chart($("#chRev"), {type:"line", data:{labels:days, datasets:[{data:week, borderColor:green, backgroundColor:green + "22", fill:true, tension:.35, pointRadius:3, pointBackgroundColor:green}]}, options:opts});
      charts.tech = new Chart($("#chTech"), {type:"bar", data:{labels:techs.map(function(t){ return t.name.split(" ")[0]; }), datasets:[{data:techJobs, backgroundColor:green, borderRadius:6, maxBarThickness:48}]}, options:opts});
    } else {
      charts.mine = new Chart($("#chMine"), {type:"bar", data:{labels:days, datasets:[{data:[2,3,1,4,2,3,myDone], backgroundColor:green, borderRadius:6, maxBarThickness:36}]}, options:opts});
    }
  }catch(e){}
}

/* ================= modal system ================= */
var modalHandler = null;
function openModal(title, bodyHTML, submitLabel, onSubmit, onMount){
  $("#modalTitle").textContent = title;
  $("#modalBody").innerHTML = bodyHTML + '<p class="form-error" id="formError"></p>';
  $("#modalSubmit").textContent = submitLabel || "Save";
  modalHandler = onSubmit;
  $("#modalWrap").classList.add("open");
  if(onMount) onMount($("#modalForm"));
  var first = $("#modalBody").querySelector("input:not([type=hidden]):not(:disabled),select");
  if(first) setTimeout(function(){ first.focus(); }, 60);
}
function closeModal(){ $("#modalWrap").classList.remove("open"); modalHandler = null; }
$("#modalForm").addEventListener("submit", function(e){
  e.preventDefault();
  var form = e.target, bad = null;
  Array.prototype.forEach.call(form.elements, function(el){ if(!bad && el.required && !el.disabled && !String(el.value).trim()) bad = el; });
  if(bad){ var lb = bad.closest(".field"); $("#formError").textContent = "Fill in " + (lb && lb.querySelector("label") ? lb.querySelector("label").textContent.toLowerCase() : "all required fields") + " to continue."; bad.focus(); return; }
  var res = modalHandler ? modalHandler(new FormData(form), form) : true;
  if(typeof res === "string"){ $("#formError").textContent = res; return; }
  closeModal();
});
$("#modalForm").addEventListener("input", function(){ var fe = $("#formError"); if(fe) fe.textContent = ""; });
function field(label, inner){ return '<div class="field"><label>' + label + '</label>' + inner + '</div>'; }
function opt(v, t, sel){ return '<option value="' + esc(v) + '"' + (sel ? ' selected' : '') + '>' + esc(t) + '</option>'; }

/* --- new order --- */
function modalNewOrder(pre){
  pre = pre || {};
  var custOpts = opt("__new", "+ New customer", !pre.customerId) + DB.customers.slice().sort(function(a,b){ return a.name.localeCompare(b.name); }).map(function(c){ return opt(c.id, c.name + " · " + c.phone, c.id === pre.customerId); }).join("");
  var body = field("Customer", '<select name="customer" id="mCust">' + custOpts + '</select>') +
    '<div class="group-box" id="mNewCust"><div class="field-row">' + field("Name", '<input type="text" name="cname" required placeholder="Tan Wei Ling">') + field("Phone", '<input type="tel" name="cphone" required placeholder="9123 4567">') + '</div></div>' +
    field("Vehicle", '<select name="vehicle" id="mVeh"></select>') +
    '<div class="group-box" id="mNewVeh"><div class="field-row">' + field("Plate number", '<input type="text" name="plate" required placeholder="SGP 1234 A">') + field("Make and model", '<input type="text" name="model" required placeholder="Toyota Corolla 2021">') + '</div></div>' +
    '<div class="field-row">' + field("Mileage (km)", '<input type="number" name="mileage" min="0" step="1" required placeholder="65000">') + field("Technician", '<select name="tech">' + technicians().map(function(t){ return opt(t.id, t.name); }).join("") + '</select>') + '</div>' +
    field("Customer complaint", '<textarea name="complaint" rows="2" placeholder="Noise from front wheel when braking"></textarea>');
  openModal("Check in vehicle", body, "Check in", function(fd){
    var cid = fd.get("customer"), vid = fd.get("vehicle"), c, v;
    var newCust = cid === "__new", newVeh = !vid || vid === "__new";
    var mileage = Number(fd.get("mileage"));
    if(isNaN(mileage) || mileage < 0) return "Enter a valid mileage.";
    if(newCust){
      var ph = fd.get("cphone").trim();
      var dupC = DB.customers.filter(function(x){ return x.phone === ph; })[0];
      if(dupC) return "This phone number belongs to " + dupC.name + ". Pick them from the customer list instead.";
    }
    if(newVeh){
      var pl = fd.get("plate").trim().toUpperCase();
      var owner = DB.customers.filter(function(x){ return x.vehicles.some(function(y){ return y.plate === pl; }); })[0];
      if(owner) return "Plate " + pl + " is already registered to " + owner.name + ".";
    } else {
      var openJob = DB.orders.filter(function(x){ return x.vehicleId === vid && ["completed","declined"].indexOf(x.stage) < 0; })[0];
      if(openJob) return "This vehicle already has an open job (" + openJob.id + "). Finish or close it first.";
      var lastKm = DB.orders.filter(function(x){ return x.vehicleId === vid; }).reduce(function(m,x){ return Math.max(m, Number(x.mileage)||0); }, 0);
      if(mileage < lastKm) return "Mileage can't be lower than the last visit (" + lastKm.toLocaleString() + " km).";
    }
    if(newCust){ c = {id:uid("c"), name:fd.get("cname").trim(), phone:fd.get("cphone").trim(), tier:"Standard", vehicles:[]}; DB.customers.push(c); }
    else c = cust(cid);
    if(newVeh){ v = {id:uid("v"), plate:fd.get("plate").trim().toUpperCase(), model:fd.get("model").trim()}; c.vehicles.push(v); }
    else v = veh(c, vid);
    var o = {id:"WO-" + (DB.nextWO++), customerId:c.id, vehicleId:v.id, stage:"reception", advisorId: me().role === "technician" ? advisors()[0].id : me().id, technicianId:fd.get("tech"),
      mileage:mileage, complaint:(fd.get("complaint")||"").trim(), createdAt:nowISO(), inspection:freshInspection(), quoteStatus:"draft", workDone:false, discount:0, items:[], payment:null, log:[]};
    log(o, "Checked in by " + me().name);
    DB.orders.push(o);
    if(pre.oppId){ var op = DB.opportunities.filter(function(x){ return x.id === pre.oppId; })[0]; if(op) op.status = "done"; }
    save(); state.orderFilter = "all"; goto("orders"); openPanel({type:"order", id:o.id});
    toast(v.plate + " checked in as " + o.id);
  }, function(form){
    var cs = form.querySelector("#mCust"), vs = form.querySelector("#mVeh");
    function toggle(box, on){ var b = form.querySelector(box); b.style.display = on ? "block" : "none"; Array.prototype.forEach.call(b.querySelectorAll("input"), function(i){ i.disabled = !on; }); }
    function syncVeh(){
      var c = cust(cs.value);
      vs.innerHTML = (c ? c.vehicles.map(function(v){ return opt(v.id, v.plate + " · " + v.model, v.id === pre.vehicleId); }).join("") : "") + opt("__new", "+ New vehicle", !c || !c.vehicles.length);
      toggle("#mNewCust", cs.value === "__new"); toggle("#mNewVeh", vs.value === "__new");
    }
    cs.addEventListener("change", function(){ pre.vehicleId = null; syncVeh(); });
    vs.addEventListener("change", function(){ toggle("#mNewVeh", vs.value === "__new"); });
    syncVeh();
  });
}

    if(!qty || qty < 1) return "Quantity must be at least 1.";
    var ex = o.items.filter(function(i){ return i.sku === p.sku; })[0];
    if(ex && !ex.approved) ex.qty += qty; else o.items.push({id:uid("i"), type:"part", sku:p.sku, name:p.name, qty:qty, price:p.price, cost:p.cost, approved:false});
    if(o.quoteStatus === "sent"){ o.quoteStatus = "draft"; }
    log(o, "Added " + p.name + " × " + qty);
    if(qty > avail(p)) toast("Only " + avail(p) + " available. Order more before approval.", true); else toast(o.stage === "in-service" ? "Added as extra work. Needs approval." : "Part added");
    refresh();
  });
}
function modalAddLabor(o, prefill){
  var body = field("Description", '<input type="text" name="name" required placeholder="Labor: wheel alignment" value="' + esc(prefill || "") + '">') +
    '<div class="field-row">' + field("Price to customer", '<input type="number" name="price" min="0" step="1" required placeholder="80">') + '<div data-cost>' + field("Internal cost", '<input type="number" name="cost" min="0" step="1" value="0">') + '</div></div>';
  openModal("Add labor", body, "Add to quote", function(fd){
    var price = Number(fd.get("price"));
    if(isNaN(price) || price < 0) return "Enter a valid price.";
    o.items.push({id:uid("i"), type:"labor", sku:"", name:fd.get("name").trim(), qty:1, price:price, cost:Number(fd.get("cost"))||0, approved:false});
    if(o.quoteStatus === "sent"){ o.quoteStatus = "draft"; }
    log(o, "Added " + fd.get("name").trim()); toast("Labor added"); refresh();
  });
}
function modalPayment(o){
  var t = totals(o);
  var body = '<div class="kpi hero" style="margin-bottom:14px"><p class="label">Amount due</p><p class="value num">' + money(t.total) + '</p><p class="foot">' + o.items.length + ' items' + (o.discount ? ' · ' + money(o.discount) + ' discount' : '') + '</p></div>' +
    field("Payment method", '<select name="method">' + ["Card","Cash","PayNow","Bank transfer"].map(function(m){ return opt(m,m); }).join("") + '</select>') +
    '<p class="sub" style="font-size:12.5px;color:var(--text-secondary);margin:0">Closing deducts parts from stock and schedules the next service follow-up.</p>';
  openModal("Take payment", body, "Confirm payment", function(fd){
    o.items.forEach(function(i){ if(i.type === "part"){ var p = part(i.sku); if(p){ p.stock = Math.max(0, p.stock - i.qty); p.reserved = Math.max(0, (p.reserved||0) - i.qty); move(p.sku, -i.qty, "sale", o.id); } } });
    o.payment = {method:fd.get("method"), amount:t.total, paidAt:nowISO()};
    o.stage = "completed";
    log(o, "Paid " + money(t.total) + " by " + fd.get("method").toLowerCase());
    o.inspection.forEach(function(i){
      var quoted = o.items.some(function(it){ return it.name.indexOf(i.name) > -1; });
      if((i.status === "attention" || (i.status === "problem" && !quoted))) DB.opportunities.push({id:uid("o"), customerId:o.customerId, type:"inspection-finding", text:i.name + (i.note ? ": " + i.note : ""), dueAt:new Date(Date.now()+30*86400000).toISOString(), sourceOrderId:o.id, status:"open", createdAt:nowISO()});
    });
    DB.opportunities.forEach(function(x){ if(x.customerId === o.customerId && x.type === "service-due" && x.status === "open") x.status = "done"; });
    DB.opportunities.push({id:uid("o"), customerId:o.customerId, type:"service-due", text:"Next service at " + (Number(o.mileage) + 10000).toLocaleString() + " km", dueAt:new Date(Date.now()+180*86400000).toISOString(), sourceOrderId:o.id, status:"open", createdAt:nowISO()});
    state.orderTab = "overview"; toast("Payment recorded. " + o.id + " closed."); refresh();
  });
}

/* --- inventory --- */
function modalNewPart(){
  var body = field("Part name", '<input type="text" name="name" required placeholder="Spark plug, iridium">') +
    '<div class="field-row">' + field("SKU", '<input type="text" name="sku" required placeholder="SPK-IR01">') + field("Category", '<select name="category">' + ["Fluids","Filters","Brakes","Engine","Electrical","Suspension","Tyres","Accessories"].map(function(c){ return opt(c,c); }).join("") + '</select>') + '</div>' +
    '<div class="field-row">' + field("Opening stock", '<input type="number" name="stock" min="0" step="1" value="0" required>') + field("Reorder at", '<input type="number" name="reorder" min="0" step="1" value="5" required>') + '</div>' +
    '<div class="field-row"><div data-cost>' + field("Cost price", '<input type="number" name="cost" min="0" step="1" value="0">') + '</div>' + field("Selling price", '<input type="number" name="price" min="0" step="1" required placeholder="25">') + '</div>' +
    field("Supplier", '<select name="supplier">' + DB.suppliers.map(function(s){ return opt(s.id, s.name); }).join("") + '</select>');
  openModal("Add part", body, "Add part", function(fd){
    var sku = fd.get("sku").trim().toUpperCase();
    if(part(sku)) return "That SKU already exists.";
    DB.inventory.push({sku:sku, name:fd.get("name").trim(), category:fd.get("category"), stock:parseInt(fd.get("stock"),10)||0, reorder:parseInt(fd.get("reorder"),10)||0, cost:Number(fd.get("cost"))||0, price:Number(fd.get("price"))||0, supplier:fd.get("supplier")});
    toast("Part added"); refresh();
  });
}
function modalAdjust(p){
  var body = '<p style="margin:0 0 12px;font-weight:600">' + esc(p.name) + ' <span style="color:var(--text-muted);font-weight:400">· ' + p.stock + ' in stock now</span></p>' +
    '<div class="field-row">' + field("New stock count", '<input type="number" name="stock" min="0" step="1" value="' + p.stock + '" required>') + field("Reorder at", '<input type="number" name="reorder" min="0" step="1" value="' + p.reorder + '" required>') + '</div>' +
    '<div class="field-row"><div data-cost>' + field("Cost price", '<input type="number" name="cost" min="0" step="1" value="' + p.cost + '">') + '</div>' + field("Selling price", '<input type="number" name="price" min="0" step="1" value="' + p.price + '"' + (can("cost") ? '' : ' disabled title="Only owners and managers can change prices"') + '>') + '</div>' +
    field("Reason", '<select name="reason">' + ["Stock count","Damaged","Returned","Other"].map(function(r){ return opt(r,r); }).join("") + '</select>');
  openModal("Adjust stock", body, "Save changes", function(fd){
    var ns = parseInt(fd.get("stock"),10) || 0;
    if(ns < (p.reserved||0)) return "Stock can't go below the " + p.reserved + " reserved for open jobs.";
    if(ns !== p.stock) move(p.sku, ns - p.stock, "adjust", "", fd.get("reason"));
    p.stock = ns; p.reorder = parseInt(fd.get("reorder"),10) || 0;
    if(can("cost")){ p.cost = Number(fd.get("cost")) || 0; p.price = Number(fd.get("price")) || 0; }
    toast("Stock updated"); refresh();
  });
}
function poLine(sku, qty){
  return '<div class="po-line"><select name="part">' + DB.inventory.map(function(p){ return opt(p.sku, p.name + " (" + avail(p) + " avail.)", p.sku === sku); }).join("") + '</select><input type="number" name="qty" min="1" step="1" value="' + (qty||1) + '" aria-label="Quantity"><button type="button" class="icon-btn" data-action="po-remove-line" aria-label="Remove line">' + icon("trash") + '</button></div>';
}
function modalNewPO(fillLow){
  var low = fillLow ? lowStock() : [];
  var lines = low.length ? low.map(function(p){ return poLine(p.sku, Math.max(p.reorder * 2 - avail(p), 1)); }).join("") : poLine(DB.inventory[0].sku, 1);
  var supp = low.length ? low[0].supplier : DB.suppliers[0].id;
  var body = field("Supplier", '<select name="supplier">' + DB.suppliers.map(function(s){ return opt(s.id, s.name, s.id === supp); }).join("") + '</select>') +
    '<div class="field"><label>Parts and quantity</label><div id="poLines">' + lines + '</div><button type="button" class="btn sm" data-action="po-add-line">' + icon("plus") + 'Add line</button></div>';
  openModal("New purchase order", body, "Place order", function(fd){
    var skus = fd.getAll("part"), qtys = fd.getAll("qty"), items = [];
    skus.forEach(function(s, i){ var q = parseInt(qtys[i],10); if(q > 0){ var ex = items.filter(function(x){ return x.sku === s; })[0]; if(ex) ex.qty += q; else items.push({sku:s, qty:q, cost:part(s).cost}); } });
    if(!items.length) return "Add at least one part with a quantity.";
    var po = {id:"PO-" + (DB.nextPO++), supplierId:fd.get("supplier"), status:"ordered", createdAt:nowISO(), items:items};
    DB.purchaseOrders.push(po); state.invTab = "po"; save(); goto("inventory"); toast(po.id + " placed with " + supplier(po.supplierId).name);
  });
}
function modalNewSupplier(){
  openModal("Add supplier", field("Supplier name", '<input type="text" name="name" required placeholder="Tyre World Pte Ltd">') + field("Phone", '<input type="tel" name="phone" required placeholder="6234 5678">'), "Add supplier", function(fd){
    DB.suppliers.push({id:uid("sp"), name:fd.get("name").trim(), phone:fd.get("phone").trim()}); toast("Supplier added"); refresh();
  });
}
function ownerCount(){ return activeUsers().filter(function(x){ return x.role === "owner"; }).length; }
function roleOptions(sel){ return ["owner","manager","advisor","technician"].map(function(r){ return opt(r, ROLE_LABEL[r], r === sel); }).join(""); }
function modalNewStaff(){
  openModal("Add user", field("Full name", '<input type="text" name="name" required placeholder="Siti Aminah">') + field("Role", '<select name="role">' + roleOptions("technician") + '</select>'), "Add user", function(fd){
    var name = fd.get("name").trim();
    if(activeUsers().some(function(x){ return x.name.toLowerCase() === name.toLowerCase(); })) return "A user with this name already exists.";
    DB.staff.push({id:uid("s"), name:name, role:fd.get("role"), active:true}); toast("User added"); setRole();
  });
}
function modalEditStaff(u){
  var jobs = DB.orders.filter(function(o){ return (o.technicianId === u.id || o.advisorId === u.id) && ["completed","declined"].indexOf(o.stage) < 0; }).length;
  var body = field("Full name", '<input type="text" name="name" required value="' + esc(u.name) + '">') +
    field("Role", '<select name="role">' + roleOptions(u.role) + '</select>') +
    '<p class="sub" style="font-size:12.5px;color:var(--text-secondary);margin:0 0 12px">' + (jobs ? esc(u.name) + ' has ' + jobs + ' open job' + (jobs>1?'s':'') + '. They stay assigned after a role change.' : 'No open jobs assigned.') + '</p>' +
    '<button type="button" class="btn danger sm" data-action="remove-staff" data-id="' + u.id + '">' + icon("trash") + 'Deactivate user</button>';
  openModal("Edit user", body, "Save changes", function(fd){
    var name = fd.get("name").trim(), role = fd.get("role");
    if(activeUsers().some(function(x){ return x.id !== u.id && x.name.toLowerCase() === name.toLowerCase(); })) return "Another user already has this name.";
    if(u.role === "owner" && role !== "owner" && ownerCount() === 1) return "Keep at least one owner. Make someone else owner first.";
    var openTech = DB.orders.filter(function(o){ return o.technicianId === u.id && ["completed","declined"].indexOf(o.stage) < 0; }).length;
    if(u.role === "technician" && role !== "technician" && openTech) return u.name + " has " + openTech + " open job" + (openTech > 1 ? "s" : "") + " as technician. Reassign them first.";
    var changed = u.role !== role;
    u.name = name; u.role = role;
    toast(changed ? name + " is now " + ROLE_LABEL[role].toLowerCase() : "User updated");
    setRole();
  });
}
function removeStaff(u){
  if(u.role === "owner" && ownerCount() === 1){ toast("Keep at least one owner", true); return; }
  var open = DB.orders.filter(function(o){ return (o.technicianId === u.id || o.advisorId === u.id) && ["completed","declined"].indexOf(o.stage) < 0; });
  if(open.length){ toast(u.name + " has " + open.length + " open job" + (open.length>1?"s":"") + ". Reassign them first.", true); return; }
  if(u.id === me().id){ toast("You can't deactivate yourself", true); return; }
  if(!confirm("Deactivate " + u.name + "? They won't be able to sign in.")) return;
  u.active = false;
  closeModal(); toast(u.name + " deactivated. Their past work stays on record."); setRole();
}

/* ================= event delegation ================= */
document.addEventListener("click", function(e){
  var el = e.target.closest("[data-action]"); if(!el) return;
  var a = el.dataset.action, o = currentOrder();
  switch(a){
    case "goto": closePanel(); goto(el.dataset.view, {filter: el.dataset.filter}); break;
    case "close-panel": closePanel(); break;
    case "close-modal": closeModal(); break;
    case "order-filter": state.orderFilter = el.dataset.f; renderOrders(); break;
    case "open-order": openPanel({type:"order", id:el.dataset.id}); break;
    case "open-customer": openPanel({type:"customer", id:el.dataset.id}); break;
    case "order-tab": state.orderTab = el.dataset.tab; renderPanel(); break;
    case "new-order": modalNewOrder({customerId:el.dataset.cust, vehicleId:el.dataset.veh}); break;
    case "new-customer": modalNewCustomer(); break;
    case "add-vehicle": modalAddVehicle(cust(state.panel.id)); break;
    case "start-insp": doStartInsp(o); break;
    case "insp-set":
      if(o && o.stage === "pre-inspection"){ o.inspection[+el.dataset.i].status = el.dataset.s; save(); renderPanel(); }
      break;
    case "finish-insp": doFinishInsp(o); break;
    case "send-quote": doSendQuote(o); break;
    case "approve-quote": doApprove(o); break;
    case "approve-extra": doApproveExtra(o); break;
    case "decline-quote": if(confirm("Mark this quotation as declined by the customer?")) doDecline(o); break;
    case "work-done": doWorkDone(o); break;
    case "take-payment":
      if(o.items.some(function(i){ return !i.approved; })){ toast("Approve or remove the extra work before payment", true); break; }
      if(!o.items.length){ toast("This order has no items to charge", true); break; }
      modalPayment(o); break;
    case "add-part": modalAddPart(o); break;
    case "add-labor": modalAddLabor(o, el.dataset.prefill); break;
    case "remove-item":
      var gone = o.items.filter(function(i){ return i.id === el.dataset.item; })[0];
      if(gone && gone.approved && gone.type === "part"){ var gp = part(gone.sku); if(gp) gp.reserved = Math.max(0, (gp.reserved||0) - gone.qty); }
      o.items = o.items.filter(function(i){ return i.id !== el.dataset.item; });
      if(o.quoteStatus === "sent") o.quoteStatus = "draft";
      log(o, "Removed an item"); refresh(); break;
    case "book-opp":
      var op = DB.opportunities.filter(function(x){ return x.id === el.dataset.id; })[0];
      if(op){ closePanel(); modalNewOrder({customerId:op.customerId, oppId:op.id}); }
      break;
    case "done-opp":
      var op2 = DB.opportunities.filter(function(x){ return x.id === el.dataset.id; })[0];
      if(op2){ op2.status = "done"; toast("Follow-up closed"); refresh(); }
      break;
    case "inv-tab": state.invTab = el.dataset.tab; renderInventory(); break;
    case "new-part": modalNewPart(); break;
    case "adjust-stock": modalAdjust(part(el.dataset.sku)); break;
    case "new-po": closePanel(); modalNewPO(el.dataset.low === "1"); break;
    case "po-add-line": $("#poLines").insertAdjacentHTML("beforeend", poLine(DB.inventory[0].sku, 1)); break;
    case "po-remove-line": if($$("#poLines .po-line").length > 1) el.closest(".po-line").remove(); break;
    case "receive-po":
      var po = DB.purchaseOrders.filter(function(x){ return x.id === el.dataset.id; })[0];
      if(po){ po.items.forEach(function(i){ var p = part(i.sku); if(p){ p.stock += i.qty; move(p.sku, i.qty, "receive", po.id); } }); po.status = "received"; po.receivedAt = nowISO(); toast(po.id + " received. Stock updated."); refresh(); }
      break;
    case "new-supplier": modalNewSupplier(); break;
    case "new-staff": modalNewStaff(); break;
    case "edit-staff": modalEditStaff(DB.staff.filter(function(x){ return x.id === el.dataset.id; })[0]); break;
    case "remove-staff": removeStaff(DB.staff.filter(function(x){ return x.id === el.dataset.id; })[0]); break;
    case "theme": DB.settings.color = el.dataset.c; applyTheme(el.dataset.c); save(); renderSettings(); toast("Colour updated"); break;
    case "reset":
      if(confirm("Reset all demo data? Your changes will be lost.")){ DB = seed(); applyTheme(null); save(); closePanel(); goto("dashboard"); toast("Demo data reset"); }
      break;
  }
});
document.addEventListener("change", function(e){
  var el = e.target, o = currentOrder();
  if(el.id === "roleSelect"){ closePanel(); state.userId = el.value; setRole(); if(state.view !== "dashboard") renderView(state.view); return; }
  if(el.id === "customColor"){ DB.settings.color = el.value; applyTheme(el.value); save(); renderSettings(); return; }
  if(!o) return;
  if(el.dataset.action === "reassign"){ o.technicianId = el.value; log(o, "Reassigned to " + staffName(el.value)); toast("Technician updated"); refresh(); }
  if(el.dataset.action === "insp-note"){ o.inspection[+el.dataset.i].note = el.value.trim(); save(); }
  if(el.dataset.action === "discount"){ o.discount = Math.max(0, Math.round(Number(el.value)||0)); if(o.discount > totals(o).sub) o.discount = totals(o).sub;
    var capD = Math.floor(totals(o).sub * 0.1);
    if(!can("cost") && o.discount > capD){ o.discount = capD; toast("Advisors can give up to 10% (" + money(capD) + "). Ask a manager for more.", true); }
    if(o.quoteStatus === "sent") o.quoteStatus = "draft"; log(o, "Discount set to " + money(o.discount)); refresh(); }
});
document.addEventListener("input", function(e){
  var el = e.target, pos;
  if(el.id === "orderSearch"){ state.orderQuery = el.value; pos = el.selectionStart; renderOrders(); var n = $("#orderSearch"); n.focus(); n.setSelectionRange(pos,pos); }
  if(el.id === "invSearch"){ state.invQuery = el.value; pos = el.selectionStart; renderInventory(); var m = $("#invSearch"); m.focus(); m.setSelectionRange(pos,pos); }
  if(el.id === "custSearch"){ state.custQuery = el.value; pos = el.selectionStart; renderCustomers(); var k = $("#custSearch"); k.focus(); k.setSelectionRange(pos,pos); }
});
$("#backdrop").addEventListener("click", closePanel);
document.addEventListener("keydown", function(e){ if(e.key === "Escape"){ if($("#modalWrap").classList.contains("open")) closeModal(); else closePanel(); } });

/* ================= init ================= */
applyTheme(DB.settings.color);
setRole();
goto("dashboard");
})();
</script>
